<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>小红书封面 v1 · 3:4 1080×1440</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  /* 小红书专用模板 · 3:4 竖版 1080×1440 */
  :root {
    --w: 1080px;
    --h: 1440px;
    --ink: #0b0d12;
    --paper: #f3efe6;
    --paper-2: #ece6d6;
    --accent: #ff5b1f;       /* 默认橙（小红书模式会被覆盖为 #ff2d55） */
    --accent-2: #ffd23f;
    --green: #6cd76b;
    --grid: rgba(11,13,18,0.06);
  }
  html, body { margin: 0; padding: 0; background: #1a1f2c; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  }
  .cover {
    width: var(--w); height: var(--h);
    position: relative; overflow: hidden;
    background: var(--paper); color: var(--ink);
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    isolation: isolate;
  }
  .cover::before {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(circle at 1px 1px, var(--grid) 1px, transparent 0);
    background-size: 24px 24px; z-index: 0;
  }

  /* 顶栏 44px（小红书专用） */
  .topbar {
    position: absolute; left: 0; right: 0; top: 0; height: 44px;
    background: var(--ink); color: var(--paper);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px;
    font-size: 14px; font-weight: 700; letter-spacing: 4px;
    z-index: 5;
  }
  .topbar .left { display: flex; align-items: center; gap: 10px; }
  .topbar .left .dot {
    width: 9px; height: 9px;
    background: var(--accent); border-radius: 50%;
    box-shadow: 0 0 0 4px rgba(255,91,31,0.18);
  }
  .topbar .right { color: var(--accent-2); }

  /* ===== 竖版布局：上下结构 ===== */

  /* Hero 区：上半部分（顶栏下方到中部） */
  .hero {
    position: absolute;
    left: 0; right: 0; top: 44px; height: 620px;
    padding: 60px 60px 0 60px;
    z-index: 2;
  }
  .hero .kicker {
    font-size: 18px; font-weight: 800; letter-spacing: 4px;
    color: var(--ink); margin-bottom: 16px;
  }
  .hero .kicker em {
    font-style: normal; background: var(--accent-2);
    padding: 0 8px; border-radius: 4px;
  }
  /* 视觉锤：大字（3:4 宽度有限，竖向堆叠） */
  .hero .num {
    font-family: "PingFang SC", "Helvetica Neue", system-ui, sans-serif;
    font-size: 200px;
    line-height: 1;
    font-weight: 900;
    letter-spacing: -4px;
    color: var(--ink);
    position: relative;
    margin: 16px 0 24px 0;
  }
  .hero .num::after {
    content: attr(data-hammer);
    position: absolute; left: 6px; top: 6px;
    color: var(--accent); z-index: -1;
  }
  .hero .sub {
    font-size: 40px; font-weight: 900; line-height: 1.35;
    letter-spacing: -0.5px; color: var(--ink);
  }
  .hero .sub .hl {
    background: var(--ink); color: var(--paper);
    padding: 0 12px;
  }

  /* 卡片区：下半部分（3 张纵列，1 列 1 张） */
  .cards {
    position: absolute;
    left: 60px; right: 60px; bottom: 120px; height: 560px;
    display: flex; flex-direction: column; gap: 18px;
    z-index: 2;
  }
  .item {
    position: relative;
    background: #fff; border: 3px solid var(--ink);
    border-radius: 16px;
    padding: 18px 24px 18px 80px;
    display: flex; flex-direction: column; justify-content: center;
    box-shadow: 6px 6px 0 var(--ink);
    overflow: hidden;
    flex: 1;
  }
  .item .ico {
    position: absolute; left: 20px; top: 50%;
    transform: translateY(-50%);
    width: 44px; height: 44px;
    display: grid; place-items: center;
    border-radius: 10px; background: var(--paper-2);
  }
  .item .step {
    position: absolute; right: 18px; top: 16px;
    font-family: "Helvetica Neue", monospace;
    font-size: 13px; font-weight: 900; letter-spacing: 2px;
    color: var(--accent); opacity: 0.7;
  }
  .item .name {
    font-size: 30px; font-weight: 900;
    letter-spacing: -0.3px; line-height: 1.1;
  }
  .item .role {
    font-size: 16px; font-weight: 700;
    color: rgba(11,13,18,0.6); letter-spacing: 0.3px;
    margin-top: 4px;
  }
  .item.pick {
    background: var(--green);
    color: var(--ink); border-color: var(--ink);
  }
  .item.pick .name { font-size: 32px; }
  .item.pick .role { color: rgba(11,13,18,0.75); }
  .item.pick .ico { background: #fff; }
  .item.pick .step { color: var(--ink); opacity: 1; }

  /* 角标（小红书版蓝色，旋转 -3deg） */
  .badge {
    position: absolute; z-index: 6;
    right: 40px; bottom: 50px;
    background: var(--blue, #0a3bd9); color: #fff;
    font-weight: 900; font-size: 22px;
    letter-spacing: 2px; padding: 12px 18px;
    transform: rotate(-3deg);
    box-shadow: 4px 4px 0 var(--ink);
  }

  /* 脚注 */
  .footer {
    position: absolute; left: 60px; bottom: 30px;
    font-size: 14px; letter-spacing: 2px;
    color: rgba(11,13,18,0.55); font-weight: 700;
    z-index: 4;
  }
  .footer-account {
    position: absolute; right: 60px; bottom: 30px;
    font-size: 14px; letter-spacing: 2px;
    color: rgba(11,13,18,0.55); font-weight: 700;
    z-index: 4;
  }
</style>
</head>
<body>
  <article class="cover"
           data-composition-id="xhs-cover-v1"
           data-width="1080"
           data-height="1440">

    <div class="topbar">
      <div class="left"><span class="dot"></span>AI · 图像生成 · 父亲节</div>
      <div class="right">小红书 · 2026-06</div>
    </div>

    <div class="badge">3 分钟讲清</div>

    <section class="hero">
      <div class="kicker">3 步讲清 <em>图像生成</em></div>
      <div class="num" data-hammer="穿越">穿越</div>
      <div class="sub">AI 从<span class="hl">噪声</span>中<br/>长出合影</div>
    </section>

    <section class="cards">
      <!-- 改这里：3 张卡片（高亮中间） -->
      <div class="item">
        <div class="ico">1</div>
        <div class="step">STEP 01</div>
        <div class="name">Vision Encoder</div>
        <div class="role">切 patch · 图转数字</div>
      </div>
      <div class="item pick">
        <div class="ico">2</div>
        <div class="step">STEP 02</div>
        <div class="name">Diffusion 扩散模型</div>
        <div class="role">从纯噪声 · 一步步去噪 30-50 步</div>
      </div>
      <div class="item">
        <div class="ico">3</div>
        <div class="step">STEP 03</div>
        <div class="name">提示词工程</div>
        <div class="role">5 个诀窍 · 人人都能用</div>
      </div>
    </section>

    <div class="footer">EP.01 · 3 STEPS · 1 PHOTO</div>
    <div class="footer-account">&lt;账号名&gt; · &lt;slogan&gt;</div>
  </article>
</body>
</html>
