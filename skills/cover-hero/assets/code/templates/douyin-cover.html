<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>抖音封面 v1 · 9:16 1080×1920</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  /* 抖音专用模板 · 9:16 竖版 1080×1920 · 戏剧风格 */
  :root {
    --w: 1080px;
    --h: 1920px;
    --ink: #0b0d12;
    --paper: #f3efe6;
    --paper-2: #ece6d6;
    --accent: #ff5b1f;
    --accent-2: #ffd23f;
    --green: #6cd76b;
    --grid: rgba(11,13,18,0.06);
  }
  html, body { margin: 0; padding: 0; background: #1a1f2c; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  }
  .cover {
    width: var(--w); height: var(--h);
    position: relative; overflow: hidden;
    background: var(--paper); color: var(--ink);
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    isolation: isolate;
    display: flex; flex-direction: column;
  }
  .cover::before {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(circle at 1px 1px, var(--grid) 1px, transparent 0);
    background-size: 24px 24px; z-index: 0;
  }

  /* 顶栏 56px（抖音专用） */
  .topbar {
    flex: 0 0 auto; height: 56px;
    background: var(--ink); color: var(--paper);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 40px;
    font-size: 16px; font-weight: 700; letter-spacing: 4px;
    z-index: 5;
  }
  .topbar .left { display: flex; align-items: center; gap: 12px; }
  .topbar .left .dot {
    width: 10px; height: 10px;
    background: var(--accent); border-radius: 50%;
    box-shadow: 0 0 0 5px rgba(255,91,31,0.18);
  }
  .topbar .right { color: var(--accent-2); }

  /* ===== 9:16 竖版布局：戏剧风（flex 自然流）===== */

  /* Hero 区：上半部分（高度由内容决定，更大更戏剧） */
  .hero {
    flex: 0 0 auto;
    padding: 90px 60px 40px 60px;
    z-index: 2;
  }
  .hero .kicker {
    font-size: 20px; font-weight: 800; letter-spacing: 4px;
    color: var(--ink); margin-bottom: 24px;
  }
  .hero .kicker em {
    font-style: normal; background: var(--accent-2);
    padding: 0 10px; border-radius: 4px;
  }
  /* 视觉锤：超大（抖音戏剧风核心） */
  .hero .num {
    font-family: "PingFang SC", "Helvetica Neue", system-ui, sans-serif;
    font-size: 280px;
    line-height: 1;
    font-weight: 900;
    letter-spacing: -4px;
    color: var(--ink);
    position: relative;
    margin: 24px 0 36px 0;
  }
  .hero .num::after {
    content: attr(data-hammer);
    position: absolute; left: 8px; top: 8px;
    color: var(--accent); z-index: -1;
  }
  .hero .sub {
    font-size: 56px; font-weight: 900; line-height: 1.4;
    letter-spacing: -0.5px; color: var(--ink);
    max-width: 88%;
  }
  .hero .sub .hl {
    background: var(--ink); color: var(--paper);
    padding: 0 14px;
  }

  /* 卡片区：下半部分（撑满 hero 之后的剩余高度，立体阴影） */
  .cards {
    flex: 1 1 auto;
    margin: 0 60px 130px 60px;
    display: flex; flex-direction: column; gap: 22px;
    min-height: 0;
    z-index: 2;
  }
  .item {
    position: relative;
    background: #fff; border: 3px solid var(--ink);
    border-radius: 18px;
    padding: 24px 28px 24px 96px;
    display: flex; flex-direction: column; justify-content: center;
    box-shadow: 8px 8px 0 var(--ink);  /* 抖音版加硬阴影（戏剧感） */
    overflow: hidden;
    flex: 1;
  }
  .item .ico {
    position: absolute; left: 24px; top: 50%;
    transform: translateY(-50%);
    width: 56px; height: 56px;
    display: grid; place-items: center;
    border-radius: 12px; background: var(--paper-2);
  }
  .item .step {
    position: absolute; right: 24px; top: 20px;
    font-family: "Helvetica Neue", monospace;
    font-size: 16px; font-weight: 900; letter-spacing: 2px;
    color: var(--accent); opacity: 0.7;
  }
  .item .name {
    font-size: 38px; font-weight: 900;
    letter-spacing: -0.3px; line-height: 1.1;
  }
  .item .role {
    font-size: 20px; font-weight: 700;
    color: rgba(11,13,18,0.6); letter-spacing: 0.3px;
    margin-top: 6px;
  }
  .item.pick {
    background: var(--green);
    color: var(--ink); border-color: var(--ink);
    box-shadow: 8px 8px 0 var(--ink);
  }
  .item.pick .name { font-size: 40px; }
  .item.pick .role { color: rgba(11,13,18,0.75); }
  .item.pick .ico { background: #fff; }
  .item.pick .step { color: var(--ink); opacity: 1; }

  /* 角标（抖音版橙色，更大，旋转 -3deg） */
  .badge {
    position: absolute; z-index: 6;
    right: 50px; bottom: 90px;
    background: var(--accent); color: #fff;
    font-weight: 900; font-size: 28px;
    letter-spacing: 2px; padding: 16px 22px;
    transform: rotate(-3deg);
    box-shadow: 5px 5px 0 var(--ink);
  }

  /* 脚注 */
  .footer {
    position: absolute; left: 60px; bottom: 40px;
    font-size: 16px; letter-spacing: 2px;
    color: rgba(11,13,18,0.55); font-weight: 700;
    z-index: 4;
  }
  .footer-account {
    position: absolute; right: 60px; bottom: 40px;
    font-size: 16px; letter-spacing: 2px;
    color: rgba(11,13,18,0.55); font-weight: 700;
    z-index: 4;
  }
</style>
</head>
<body>
  <article class="cover"
           data-composition-id="douyin-cover-v1"
           data-width="1080"
           data-height="1920">

    <div class="topbar">
      <div class="left"><span class="dot"></span>AI · 图像生成 · 父亲节</div>
      <div class="right">抖音 · 2026-06</div>
    </div>

    <div class="badge">3 分钟讲清</div>

    <section class="hero">
      <div class="kicker">3 步讲清 <em>图像生成</em></div>
      <div class="num" data-hammer="穿越">穿越</div>
      <div class="sub">AI 从<span class="hl">噪声</span>中<br/>长出合影</div>
    </section>

    <section class="cards">
      <!-- 改这里：3 张卡片（高亮中间） -->
      <div class="item">
        <div class="ico">1</div>
        <div class="step">STEP 01</div>
        <div class="name">Vision Encoder</div>
        <div class="role">切 patch · 图转数字</div>
      </div>
      <div class="item pick">
        <div class="ico">2</div>
        <div class="step">STEP 02</div>
        <div class="name">Diffusion 扩散模型</div>
        <div class="role">从纯噪声 · 一步步去噪 30-50 步</div>
      </div>
      <div class="item">
        <div class="ico">3</div>
        <div class="step">STEP 03</div>
        <div class="name">提示词工程</div>
        <div class="role">5 个诀窍 · 人人都能用</div>
      </div>
    </section>

    <div class="footer">EP.01 · 3 STEPS · 1 PHOTO</div>
    <div class="footer-account">&lt;账号名&gt; · &lt;slogan&gt;</div>
  </article>
</body>
</html>
