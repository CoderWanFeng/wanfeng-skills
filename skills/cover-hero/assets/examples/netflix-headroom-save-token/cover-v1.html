<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>公众号封面 v1 · Netflix Headroom · Token 直降 95%</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  /* 公众号头条主封面 2.35:1 (900×383) · HyperFrames 风格 */
  :root {
    --w: 900px;
    --h: 383px;
    --ink: #0b0d12;
    --paper: #f3efe6;
    --paper-2: #ece6d6;
    --accent: #ff5b1f;
    --accent-2: #ffd23f;
    --green: #6cd76b;
    --blue: #0a3bd9;
    --grid: rgba(11,13,18,0.06);
  }
  html, body { margin: 0; padding: 0; background: #1a1f2c; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  }
  .cover {
    width: var(--w); height: var(--h);
    position: relative; overflow: hidden;
    background: var(--paper); color: var(--ink);
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    isolation: isolate;
  }
  .cover::before {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(circle at 1px 1px, var(--grid) 1px, transparent 0);
    background-size: 18px 18px; z-index: 0;
  }
  .topbar {
    position: absolute; left: 0; right: 0; top: 0; height: 36px;
    background: var(--ink); color: var(--paper);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px; z-index: 5;
    font-size: 12px; font-weight: 700; letter-spacing: 4px;
  }
  .topbar .left { display: flex; align-items: center; gap: 10px; }
  .topbar .left .dot {
    width: 8px; height: 8px;
    background: var(--accent); border-radius: 50%;
    box-shadow: 0 0 0 4px rgba(255,91,31,0.18);
  }
  .topbar .right { color: var(--accent-2); }

  /* 主区 */
  .stage {
    position: absolute; left: 0; right: 0; top: 36px; bottom: 0;
    display: grid; grid-template-columns: 360px 1fr; z-index: 2;
  }
  .hero {
    position: relative; padding: 18px 0 0 36px;
  }
  .hero .kicker {
    font-size: 14px; font-weight: 800; letter-spacing: 3px;
    color: var(--ink); margin-bottom: 4px;
  }
  .hero .kicker em {
    font-style: normal; background: var(--accent-2);
    padding: 0 6px; border-radius: 3px;
  }
  /* 视觉锤：÷ 20 + 95% */
  .hero .num {
    font-family: "Helvetica Neue", "Inter", system-ui, sans-serif;
    font-size: 140px;
    line-height: 0.85;
    font-weight: 900;
    letter-spacing: -4px;
    color: var(--ink);
    margin-top: 4px;
    position: relative;
  }
  .hero .num::after {
    content: "÷ 20";
    position: absolute; left: 6px; top: 6px;
    color: var(--accent); z-index: -1;
  }
  .hero .sub {
    margin-top: 12px;
    font-size: 18px; font-weight: 900; line-height: 1.3;
    letter-spacing: -0.3px; color: var(--ink);
  }
  .hero .sub .hl {
    background: var(--ink); color: var(--paper);
    padding: 0 6px;
  }
  .hero .sub .save {
    color: var(--accent); font-weight: 900;
  }

  /* 右：4 卡片 1 列竖排（避开角标位置） */
  .grid {
    position: relative;
    padding: 22px 22px 14px 18px;
    display: grid; grid-template-columns: 1fr;
    grid-auto-rows: 1fr; gap: 6px;
  }
  .item {
    position: relative;
    background: #fff; border: 2px solid var(--ink);
    border-radius: 8px;
    padding: 5px 10px 5px 42px;
    display: flex; flex-direction: column; justify-content: center;
    box-shadow: 3px 3px 0 var(--ink);
    overflow: hidden;
  }
  .item .ico {
    position: absolute; left: 7px; top: 50%;
    transform: translateY(-50%);
    width: 26px; height: 26px;
    display: grid; place-items: center;
    border-radius: 5px; background: var(--paper-2);
  }
  .item .name {
    font-size: 13.5px; font-weight: 900;
    letter-spacing: -0.2px; line-height: 1.1;
  }
  .item .role {
    font-size: 10px; font-weight: 700;
    color: rgba(11,13,18,0.6); letter-spacing: 0.3px;
    margin-top: 1px;
  }
  /* 核心数据卡（绿色） */
  .item.pick {
    background: var(--green);
    color: var(--ink); border-color: var(--ink);
  }
  .item.pick .name { font-size: 14px; }
  .item.pick .role { color: rgba(11,13,18,0.75); }
  .item.pick .ico { background: #fff; }

  /* 角标 */
  .picked-badge {
    position: absolute; z-index: 6;
    right: 16px; top: 46px;
    background: var(--accent); color: #fff;
    font-weight: 900; font-size: 12px;
    letter-spacing: 2px; padding: 6px 10px;
    transform: rotate(6deg);
    box-shadow: 3px 3px 0 var(--ink);
  }

  /* 底部脚注 */
  .footer {
    position: absolute; left: 36px; bottom: 14px;
    font-size: 11px; letter-spacing: 2px;
    color: rgba(11,13,18,0.55); font-weight: 700;
    z-index: 4;
  }
  .footer-account {
    position: absolute; right: 36px; bottom: 14px;
    font-size: 11px; letter-spacing: 2px;
    color: rgba(11,13,18,0.55); font-weight: 700;
    z-index: 4;
  }
</style>
</head>
<body>
  <article class="cover"
           data-composition-id="wechat-cover-headroom"
           data-width="900"
           data-height="383">

    <div class="topbar">
      <div class="left"><span class="dot"></span>NETFLIX · TOKEN · SAVER</div>
      <div class="right">OPEN SOURCE · 2026-05</div>
    </div>

    <div class="picked-badge">−95% Token</div>

    <div class="stage">
      <!-- 左：大号 ÷ 20 + 主标 -->
      <section class="hero">
        <div class="kicker">AI 编码 <em>账单减半</em></div>
        <div class="num">÷ 20</div>
        <div class="sub">一次 <span class="hl">上下文压缩</span><br/>省 <span class="save">95%</span> Token 费</div>
      </section>

      <!-- 右：4 卡片 -->
      <section class="grid">
        <!-- 卡 1: 一行命令接入 -->
        <div class="item">
          <div class="ico">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0b0d12" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="4 17 10 11 4 5"/>
              <line x1="12" y1="19" x2="20" y2="19"/>
            </svg>
          </div>
          <div class="name">一行命令接入</div>
          <div class="role">pip install headroom-ai</div>
        </div>

        <!-- 卡 2: 内容识别 -->
        <div class="item">
          <div class="ico">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0b0d12" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7"/>
              <rect x="14" y="3" width="7" height="7"/>
              <rect x="3" y="14" width="7" height="7"/>
              <rect x="14" y="14" width="7" height="7"/>
            </svg>
          </div>
          <div class="name">自动识别内容类型</div>
          <div class="role">JSON · 代码 · 日志 · 文本</div>
        </div>

        <!-- 卡 3: 接入方式 -->
        <div class="item">
          <div class="ico">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0b0d12" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"/>
              <path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>
            </svg>
          </div>
          <div class="name">3 种接入方式</div>
          <div class="role">wrap / proxy / SDK</div>
        </div>

        <!-- 卡 4: 可逆（绿色高亮 - 关键差异点） -->
        <div class="item pick">
          <div class="ico">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0b0d12" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="1 4 1 10 7 10"/>
              <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
            </svg>
          </div>
          <div class="name">可逆 · 原文随时取回</div>
          <div class="role">压缩层 · 信息零丢失</div>
        </div>
      </section>
    </div>

    <!-- 底部脚注：左侧 = 系列期号 / 右侧 = 账号占位符 -->
    <div class="footer">EP.02 · 1 TOOL · 95% SAVE</div>
    <div class="footer-account">&lt;账号名&gt; · &lt;slogan&gt;</div>
  </article>
</body>
</html>
